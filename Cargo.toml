[package]
name = "horizon-mod-fabrishot"
version = "1.0.1"
edition = "2024"
license = "MIT"
publish = false
description = "High-resolution, delay-timed screenshots with custom file names and formats: an exact 1:1 Rust port of Fabrishot."

[lib]
path = "src/lib.rs"

[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp"] }
